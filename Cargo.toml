[package]
name = "epoch-map"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Fixed-capacity lock-free concurrent hash map with epoch-based reclamation"

[lib]
path = "src/lib.rs"

[features]
default = []

[dev-dependencies]
criterion = "0.5"
dashmap = "6"

[[bench]]
name = "concurrent"
harness = false

[[example]]
name = "p99"
path = "examples/p99.rs"
