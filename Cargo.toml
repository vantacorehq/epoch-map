[package]
name = "epoch-map"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Fixed-capacity concurrent hash map with quiescent-epoch reclamation (no_std + alloc)"
readme = "README.md"
keywords = ["hashmap", "concurrent", "lock-free", "no_std", "epoch"]
categories = ["data-structures", "concurrency", "no-std"]

[lib]
path = "src/lib.rs"

[dev-dependencies]
criterion = "0.5"
dashmap = "6"

[[bench]]
name = "vs_dashmap"
harness = false

[[example]]
name = "p99"
path = "examples/p99.rs"

[profile.release]
debug = false
