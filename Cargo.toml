[package]
name = "epoch-map"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Fixed-capacity concurrent hash map with quiescent-epoch reclamation (no_std + alloc). High-performance lock-free map."
readme = "README.md"
keywords = ["hashmap", "concurrent", "lock-free", "no_std", "epoch"]
categories = ["data-structures", "concurrency", "no-std"]
repository = "https://github.com/vantacorehq/epoch-map"

[lib]
path = "src/lib.rs"

[features]
default = ["std"]
std = []
# Enable loom model checking tests (cargo test --features loom)
loom = []

[profile.release]
debug = false
lto = true
codegen-units = 1

[dev-dependencies]
loom = "0.7"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"

[[bench]]
name = "contention"
harness = false

[[bench]]
name = "vs_dashmap"
harness = false

[package.metadata.docs.rs]
all-features = true
